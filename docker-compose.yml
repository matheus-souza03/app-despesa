# Desenvolvimento local (ADR-0011). Sobe só o PostgreSQL; a API, o worker e o web rodam com `pnpm dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: despesas
      POSTGRES_PASSWORD: despesas
      POSTGRES_DB: despesas
    ports:
      - '5432:5432'
    volumes:
      - db-dados:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U despesas -d despesas']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-dados:
